<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Portal</title>
    <style>
        body {
            background-color: #000000;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .glowing-download-btn {
            display: inline-block;
            background-color: #ff0000;
            color: #ffffff;
            padding: 30px 60px;
            font-family: 'Segoe UI', -apple-system, Roboto, sans-serif;
            font-size: 2.2rem;
            font-weight: bold;
            text-transform: uppercase;
            text-decoration: none;
            letter-spacing: 1px;
            border-radius: 12px;
            border: 2px solid #ff3333;
            cursor: pointer;
            animation: pulse-glow 2s infinite ease-in-out;
        }

        @keyframes pulse-glow {
            0% {
                transform: scale(1);
                box-shadow: 0 0 20px rgba(255, 0, 0, 0.6), 0 0 40px rgba(255, 0, 0, 0.4);
            }
            50% {
                transform: scale(1.04);
                box-shadow: 0 0 40px rgba(255, 0, 0, 0.9), 0 0 70px rgba(255, 0, 0, 0.6);
            }
            100% {
                transform: scale(1);
                box-shadow: 0 0 20px rgba(255, 0, 0, 0.6), 0 0 40px rgba(255, 0, 0, 0.4);
            }
        }
    </style>
</head>
<body>

    <a href="cyber_learning.bat" download="cyber_learning.bat" class="glowing-download-btn">
        download for cyber securitty worksheet
    </a>

</body>
</html>
