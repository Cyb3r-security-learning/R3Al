<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C:\Windows\system32\cmd.exe</title>
    <style>
        body {
            background-color: #000000;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Consolas, "Lucida Console", Monaco, monospace;
        }

        /* Simulated Command Prompt Window Wrapper */
        .cmd-window {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background-color: #000000;
        }

        /* Top Title Bar */
        .title-bar {
            background-color: #ffffff;
            color: #000000;
            padding: 4px 12px;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
        }

        .window-controls {
            display: flex;
            gap: 15px;
            font-size: 14px;
        }

        /* Terminal Screen Text Area */
        .terminal-body {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
            color: #ffffff; /* Starts as white text, just like a standard CMD */
            font-size: 14px;
            line-height: 1.3;
            white-space: pre-wrap;
        }

        /* Active Green Class triggered by 'color a' */
        .terminal-body.color-a {
            color: #00ff00 !important;
        }

        /* Cursor Effect */
        .cursor {
            display: inline-block;
            width: 8px;
            height: 15px;
            background-color: currentColor;
            animation: blink 0.8s infinite;
            vertical-align: middle;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="cmd-window">
        <div class="title-bar">
            <span>Command Prompt</span>
            <div class="window-controls">
                <span>—</span>
                <span>❑</span>
                <span>✕</span>
            </div>
        </div>
        <div id="cmd-screen" class="terminal-body">Microsoft Windows [Version 10.0.22631]
(c) Microsoft Corporation. All rights reserved.

C:\Users\Student&gt; <span id="typing-area"></span><span class="cursor"></span></div>
    </div>

    <script>
        const screen = document.getElementById('cmd-screen');
        const typingArea = document.getElementById('typing-area');
        
        // Step-by-step automation sequences
        const sequences = [
            { type: 'command', text: 'color a\n' },
            { type: 'action', action: () => screen.classList.add('color-a') },
            { type: 'wait', ms: 800 },
            { type: 'text', text: 'C:\\Users\\Student&gt; ' },
            { type: 'command', text: 'dir /s\n' },
            { type: 'wait', ms: 500 },
            { type: 'stream' }
        ];

        // Simulated Windows file paths for the dir /s command
        const mockFiles = [
            " Directory of C:\\Windows\\System32\n\n07/11/2026  14:32    <DIR>          drivers\n07/11/2026  14:32    <DIR>          wbem\n10/11/2026  09:56            18,432 cmd.exe\n10/11/2026  09:56            45,200 taskmgr.exe",
            " Directory of C:\\Windows\\System32\\drivers\\etc\n\n18/09/2026  11:12               824 hosts\n18/09/2026  11:12             3,421 networks\n18/09/2026  11:12             1,204 services",
            " Directory of C:\\Users\\Student\\Documents\\CyberLab\n\n02/11/2026  16:05    <DIR>          .\n02/11/2026  16:05    <DIR>          ..\n05/11/2026  08:19             4,096 network_log.pcap\n09/11/2026  22:41             1,024 security_policy.txt",
            " Directory of C:\\Program Files\\Windows Defender\n\n12/10/2026  03:14    <DIR>          Platform\n24/10/2026  17:45         4,128,500 MsMpEng.exe"
        ];

        let seqIndex = 0;

        function processSequence() {
            if (seqIndex >= sequences.length) return;
            
            const current = sequences[seqIndex];

            if (current.type === 'command') {
                let charIndex = 0;
                // Type out the command letter by letter
                const typer = setInterval(() => {
                    if (charIndex < current.text.length) {
                        typingArea.innerHTML += current.text.charAt(charIndex);
                        charIndex++;
                    } else {
                        clearInterval(typer);
                        // Push text to main screen history and clear active typing row
                        screen.innerHTML = screen.innerHTML.replace('<span id="typing-area"></span><span class="cursor"></span>', typingArea.innerHTML);
                        screen.innerHTML += '<span id="typing-area"></span><span class="cursor"></span>';
                        // Re-bind the elements since innerHTML resets them
                        refreshElements(); 
                        seqIndex++;
                        processSequence();
                    }
                }, 150); // Speed of user typing the command
            } 
            else if (current.type === 'action') {
                current.action();
                seqIndex++;
                processSequence();
            } 
            else if (current.type === 'wait') {
                setTimeout(() => {
                    seqIndex++;
                    processSequence();
                }, current.ms);
            } 
            else if (current.type === 'text') {
                const activeTyping = document.getElementById('typing-area');
                activeTyping.innerHTML = current.text;
                seqIndex++;
                processSequence();
            }
            else if (current.type === 'stream') {
                // Remove typing block and start infinite fast-scrolling dir /s execution
                const cursor = screen.querySelector('.cursor');
                if (cursor) cursor.remove();
                document.getElementById('typing-area').remove();
                
                setInterval(() => {
                    const randomBlock = mockFiles[Math.floor(Math.random() * mockFiles.length)];
                    const hexId = Math.floor(Math.random() * 16777215).toString(16).toUpperCase();
                    
                    screen.innerHTML += `\n\n[Record ID: ${hexId}]\n${randomBlock}`;
                    screen.scrollTop = screen.scrollHeight; // Auto-scroll to bottom

                    // Memory management fallback to keep page performing smoothly
                    if (screen.innerHTML.length > 12000) {
                        screen.innerHTML = "C:\\Users\\Student&gt; dir /s [Output truncated for lab system stability]\n" + screen.innerHTML.substring(6000);
                    }
                }, 60); // Fast scrolling display speed
            }
        }

        function refreshElements() {
            // Helper function to maintain Javascript pointer hooks on dynamic HTML text
            const oldTyping = document.getElementById('typing-area');
            oldTyping.id = ''; 
            const spans = screen.getElementsByTagName('span');
            spans[spans.length - 2].id = 'typing-area';
        }

        // Start the automated presentation after a brief initial pause
        setTimeout(processSequence, 1000);
    </script>
</body>
</html>
